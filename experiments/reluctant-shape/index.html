<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reluctant Shape</title>

  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="experiment">

  <button class="experiment-close">×</button>

  <div class="reluctant-stage">
    <div class="reluctant-circle"></div>
  </div>

  <div class="experiment-hint">
    Move closer. The shape resists.
  </div>

  <div class="mobile-notice">
    This experiment relies on cursor proximity.<br />
    For the intended experience, view on a desktop device.
  </div>

  <div class="cursor-dot"></div>
  <div class="page-transition active"></div>

  <script src="../../cursor.js"></script>
  <script src="../../transition.js"></script>
  <script src="script.js"></script>

</body>
</html>
